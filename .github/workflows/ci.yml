name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # embeddingsDao's tests exercise real pgvector behavior (see
    # backend/daos/embeddingsDao_test.go); this service's defaults match what
    # backend/managers/postgresManager.go falls back to when POSTGRES_* env
    # vars aren't set, so those tests connect without extra wiring here.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fake-pass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectomeMCP
    # The end-to-end test builds and runs the real Go backend binary, which
    # now connects to Postgres on boot (see backend/managers/postgresManager.go)
    # and, since memoryResource embeds/indexes on every write (Phase 1B), calls
    # out to Ollama on every remember. These match the defaults the backend
    # falls back to when POSTGRES_*/OLLAMA_HOST env vars aren't set, so the
    # e2e test's backend subprocess can connect without any extra wiring here.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fake-pass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      ollama:
        image: ollama/ollama:latest
        env:
          OLLAMA_HOST: "0.0.0.0"
        ports:
          - 11434:11434
        options: >-
          --health-cmd="ollama list || exit 1"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=30
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: connectomeMCP/uv.lock
      - name: Pull the embedding model
        run: |
          curl -sf http://localhost:11434/api/pull -d '{"name": "nomic-embed-text"}'
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest

  westmarches:
    name: West Marches eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals/westmarches
    # The eval's leakage score needs no LLM, only a live backend: this job
    # builds and starts the Go backend against these services, writes the
    # checked-in campaign into a scratch tome, and fails if recall returns any
    # result its viewer may not see (see evals/westmarches/README.md).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fake-pass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      ollama:
        image: ollama/ollama:latest
        env:
          OLLAMA_HOST: "0.0.0.0"
        ports:
          - 11434:11434
        options: >-
          --health-cmd="ollama list || exit 1"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=30
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: evals/westmarches/uv.lock
      - name: Pull the embedding model
        run: |
          curl -sf http://localhost:11434/api/pull -d '{"name": "nomic-embed-text"}'
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest
      - name: Start the backend
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/connectome-backend" .
          mkdir -p "$RUNNER_TEMP/home/.connectome"
          HOME="$RUNNER_TEMP/home" PORT=8080 MEMORY_MANAGER=local apikey=ci GIN_MODE=release \
            nohup "$RUNNER_TEMP/connectome-backend" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/api/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Leakage check
        env:
          CONNECTOME_API_KEY: ci
        run: uv run westmarches-eval --fail-on-leak

  python-client:
    name: Python client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectomeClient
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: connectomeClient/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Seed env files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
      - run: docker compose build
