[project]
name = "westmarches-eval"
version = "0.1.0"
description = "West Marches belief eval for Connectome: leakage, staleness, truth status, perspective and graph questions"
readme = "README.md"
authors = [
    { name = "David Favela", email = "dfavelava@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "connectomeclient",
    "httpx>=0.28.1",
    "locomo-eval",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
westmarches-eval = "westmarches_eval.cli:main"

[tool.uv.sources]
connectomeclient = { path = "../../connectomeClient", editable = true }
# For its LLM client, judge prompts and judge parsing.
locomo-eval = { path = "../locomo", editable = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
