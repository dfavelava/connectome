  # Perspective: each viewer gets their own party's version of the event.
  - {id: persp-bridge-lanterns, kind: perspective, as: bram, question: "Why did the Ostry Ford bridge collapse?", answer: "A figure in grey robes cut its ropes moments before it fell.", gold: [bridge-lanterns]}
  - {id: persp-bridge-greyhawks, kind: perspective, as: ewan, question: "Why did the Ostry Ford bridge collapse?", answer: "Its pilings were rotted through and the storm finished it off, the Greyhawks think.", gold: [bridge-greyhawks]}
  - {id: persp-bridge-wardens, kind: perspective, as: hale, question: "Why did the Ostry Ford bridge collapse?", answer: "Goblins boasted that their chief Nim brought it down.", gold: [bridge-wardens]}
  - {id: persp-fire-lanterns, kind: perspective, as: cyd, question: "What do we know about the Brindle Haven market fire?", answer: "It started in Tamsin's storehouse, Ysolde said after the Lanterns pulled her out.", gold: [fire-lanterns]}
  - {id: persp-fire-greyhawks, kind: perspective, as: dara, question: "What do we know about the Brindle Haven market fire?", answer: "A hooded arsonist set it and escaped through the alleys by the east gate.", gold: [fire-greyhawks]}
  - {id: persp-fire-wardens, kind: perspective, as: ivo, question: "What do we know about the Brindle Haven market fire?", answer: "Lamp oil on the stalls suggests it was set to cover a theft from the counting house.", gold: [fire-wardens]}
  - {id: persp-bell-lanterns, kind: perspective, as: ana, question: "What happened when the Sunken Abbey bell tolled?", answer: "Thirteen strokes and a green light over the water.", gold: [bell-lanterns]}
  - {id: persp-bell-greyhawks, kind: perspective, as: fio, question: "What happened when the Sunken Abbey bell tolled?", answer: "It was faint from Thornvale, and Fio swore it rang backwards.", gold: [bell-greyhawks]}
  - {id: persp-bell-wardens, kind: perspective, as: gus, question: "What happened when the Sunken Abbey bell tolled?", answer: "Mirewater went still and every fish in it rose to the surface dead.", gold: [bell-wardens]}

