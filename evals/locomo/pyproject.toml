[project]
name = "locomo-eval"
version = "0.1.0"
description = "LoCoMo retrieval-recall eval harness for Connectome"
readme = "README.md"
authors = [
    { name = "David Favela", email = "dfavelava@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "connectomeclient",
    "python-dotenv>=1.1.1",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
locomo-eval = "locomo_eval.cli:main"

[tool.uv.sources]
connectomeclient = { path = "../../connectomeClient", editable = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
