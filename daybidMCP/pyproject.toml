[project]
name = "daybidmcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Favela", email = "dfavelava@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
daybidmcp = "daybidmcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
