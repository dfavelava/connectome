[project]
name = "daybidmcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Favela", email = "dfavelava@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
daybidmcp = "daybidmcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "python-frontmatter>=1.1",
    "ruff>=0.14.0",
    "ty>=0.0.1a10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ty.src]
# Type-check the package source; the test suite leans on dynamic
# pytest/frontmatter patterns that the checker can't model yet.
include = ["src"]
